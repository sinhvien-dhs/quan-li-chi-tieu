name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Inject Firebase config từ GitHub Secrets vào js/config.js
      # (thay thế các placeholder "__FIREBASE_*__" bằng giá trị thật)
      - name: Inject Firebase config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          echo "🔑 Injecting Firebase config from GitHub Secrets..."
          sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" js/config.js
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${FIREBASE_AUTH_DOMAIN}|g" js/config.js
          sed -i "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g" js/config.js
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${FIREBASE_STORAGE_BUCKET}|g" js/config.js
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" js/config.js
          sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g" js/config.js
          echo "✅ Config injected (key redacted):"
          grep -c "apiKey" js/config.js

      - name: Unit test - lop nghiep vu
        run: node tests/business.test.js

      - name: Unit test - phan tich AI va tieng long
        run: node tests/ai.test.js

      - name: Unit test - chia tien va so no
        run: node tests/split.test.js

      - name: Unit test - luu du lieu va bao cao
        run: node tests/storage.test.js

      - name: Unit test - xac thuc va auth wall
        run: node tests/auth.test.js

      - name: Lint Firestore security rules
        run: node tests/rules.lint.js

      - name: Syntax check
        run: |
          for f in js/*.js; do node --check "$f" || exit 1; done